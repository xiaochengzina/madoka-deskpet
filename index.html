<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Madoka 桌宠</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* 模型画布容器：铺满窗口，透明背景 */
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: transparent;
    }

    /* pixi.js 创建的 canvas 元素 */
    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* 加载状态提示 */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: rgba(255, 255, 255, 0.6);
      font: 13px/1.4 "Segoe UI", "Microsoft YaHei UI", sans-serif;
      pointer-events: none;
      z-index: 10;
    }

    #loading .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading.hidden {
      display: none;
    }

    /* 错误提示 */
    #error-msg {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: rgba(255, 100, 100, 0.8);
      font: 13px/1.6 "Segoe UI", "Microsoft YaHei UI", sans-serif;
      text-align: center;
      padding: 20px;
      z-index: 10;
      pointer-events: none;
    }

    #error-msg.visible {
      display: flex;
    }
  </style>
</head>
<body>
  <div id="canvas-container" class="drag-region">
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading Live2D...</span>
    </div>
    <div id="error-msg"></div>
  </div>

  <!-- 库文件（本地引入，无外部依赖）
       加载顺序：Cubism Core → PIXI v6 → pixi-live2d-display(cubism4-only) → main
       PIXI v6 浏览器 bundle 自带 PIXI.utils（含 EventEmitter/url），
       live2d.min.js 的 UMD 浏览器分支只需 PIXI.utils 子命名空间，
       math/core/display 直接映射到扁平 PIXI 对象，无需手动别名。 -->
  <script src="cubismcore.min.js"></script>
  <script src="pixi.min.js"></script>
  <script src="live2d.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
